name: Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Identify compiler cache compatibility
        id: toolchain
        run: |
          $rust = rustc --version --verbose | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msvc = & $vswhere -latest -products '*' -property installationVersion | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $description = "$rust`n$msvc"
          Write-Host $description
          $identity = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($description))).ToLowerInvariant()
          "identity=$identity" >> $env:GITHUB_OUTPUT
      - name: Restore pinned native sources and runtime
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            vendor/libraw
            vendor/onnxruntime
            vendor/libjxl
          key: native-windows-x64-v2-${{ hashFiles('config/libraw.json', 'config/onnxruntime.json', 'config/libjxl.json', 'scripts/prepare.py', 'scripts/prepare_ort.py', 'scripts/prepare_jxl_runtime.py') }}
      - name: Prepare pinned native libraries
        run: |
          python scripts/prepare.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_jxl_runtime.py --prepare-only
      - name: Save pinned native sources and runtime
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            vendor/libraw
            vendor/onnxruntime
            vendor/libjxl
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Restore Rust dependencies and release build
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: windows-release-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs', 'native/**', 'config/*.json', '.github/workflows/windows.yml') }}-${{ github.sha }}
          restore-keys: |
            windows-release-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs', 'native/**', 'config/*.json', '.github/workflows/windows.yml') }}-
            windows-release-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-
      # Install after restoring target/release so an older cache cannot replace it.
      - name: Install pinned JPEG XL runtime and notices
        run: python scripts/prepare_jxl_runtime.py --profile release
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test JPEG XL runtime preparation and packaging guards
        run: python -m unittest discover -s scripts -p test_jxl_runtime.py -v
      - name: Test native computations and caches
        id: tests
        run: cargo test --release --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Check standalone CLI and embedded LPIPS
        run: python scripts/ci_smoke.py --exe target/release/scrutivue.exe
      - name: Package Windows x64 application and notices
        run: |
          python scripts/package_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_package.py
      # Keep completed dependencies even when a later test or packaging check fails.
      - name: Save Rust dependencies and release build
        if: always() && !cancelled() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' && steps.tests.outcome != 'skipped' && hashFiles('target/release/.cargo-lock') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Scrutivue-windows-x64
          path: target/dist/Scrutivue-windows-x64.zip
          if-no-files-found: error
          compression-level: 0 # The uploaded file is already a ZIP.
          retention-days: 30
