name: Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Prepare pinned native libraries
        run: python scripts/prepare.py
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test native computations and caches
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Check standalone CLI and embedded LPIPS
        run: python scripts/ci_smoke.py --exe target/release/scrutivue.exe
      - name: Package Windows x64 application and notices
        run: |
          python scripts/package_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Scrutivue-windows-x64
          path: target/dist/Scrutivue-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
