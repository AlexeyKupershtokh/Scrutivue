[package]
name = "scrutivue"
version = "0.3.3"
edition = "2021"
description = "Scrutivue — a GPU-assisted photograph and RAW comparison viewer"
license = "MIT"
repository = "https://github.com/AlexeyKupershtokh/Scrutivue"
build = "build.rs"
default-run = "scrutivue"

[features]
default = ["experimental-nef-progressive"]
experimental-jxl-parallel = []
experimental-single-parallel = ["experimental-jxl-parallel"]
experimental-nef-progressive = ["experimental-single-parallel"]

[[bin]]
name = "scrutivue-jxl-parallel"
path = "src/bin/scrutivue-jxl-parallel.rs"
required-features = ["experimental-jxl-parallel"]
test = false
bench = false

[[bin]]
name = "scrutivue-single-parallel"
path = "src/bin/scrutivue-single-parallel.rs"
required-features = ["experimental-single-parallel"]
test = false
bench = false

[[bin]]
name = "scrutivue-nef-progressive"
path = "src/bin/scrutivue-nef-progressive.rs"
required-features = ["experimental-nef-progressive"]
test = false
bench = false

[dependencies]
gpui-kit = "=0.8.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "exr"] }
rfd = "0.15"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "dx12", "metal", "vulkan"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1.10"
lru = "0.12"
directories = "6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
libz-sys = { version = "1.1", features = ["static"] }
smol = "2"
memmap2 = "0.9"
raw-window-handle = "0.6"
ssimulacra2 = "=0.5.1"
jxl-oxide = "=0.12.5"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"] }
sha2 = "0.10"
libloading = "=0.8.9"

[build-dependencies]
embed-resource = "3"
cc = { version = "1", features = ["parallel"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = 1
opt-level = 2
