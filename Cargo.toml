[package]
name = "lumen-diff"
version = "0.1.0"
edition = "2021"
description = "A GPU-assisted image and RAW comparison desk"
license = "MIT"
build = "build.rs"

[dependencies]
gpui-kit = "=0.8.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "exr"] }
rfd = "0.15"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "dx12", "metal", "vulkan"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1.10"
lru = "0.12"
directories = "6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
libz-sys = { version = "1.1", features = ["static"] }
smol = "2"
memmap2 = "0.9"
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "3"
cc = { version = "1", features = ["parallel"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = 1
opt-level = 2
